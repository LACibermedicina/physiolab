services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fisio
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: fisiomotion
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fisio -d fisiomotion"]
      interval: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: [DOMAIN]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data]
    depends_on: [app]
volumes:
  pgdata:
  caddy_data:
