<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhysioLab</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f5f0;--card:#fff;--tx:#14213d;--mu:#667085;--ln:#e4e0d6;--ac:#f26b21;--bl:#0b3d91;--ok:#12a36b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1424;--card:#142036;--tx:#eef2fb;--mu:#9aa9c4;--ln:#243452;--ac:#ff8a4c;--bl:#6aa5ff;--ok:#3ddc97}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1424;--card:#142036;--tx:#eef2fb;--mu:#9aa9c4;--ln:#243452;--ac:#ff8a4c;--bl:#6aa5ff;--ok:#3ddc97}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.2rem;margin-right:auto}.brand small{display:block;font-weight:400;font-size:.65rem;color:var(--mu)}
.pill,.chip,.btn{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.9rem}
.pill.on,.chip.on,.btn{background:var(--ac);border-color:var(--ac);color:#fff}.chip{padding:5px 12px;font-size:.82rem}.chip.on{background:var(--bl);border-color:var(--bl)}
.flag{border:0;background:none;font-size:1.4rem;cursor:pointer;opacity:.5}.flag.on{opacity:1}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
input,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:9px;font:inherit;margin:4px 0}
.masthead{text-align:center;border-top:4px solid var(--tx);border-bottom:1px solid var(--tx);padding:8px 0;margin-bottom:14px}.mh{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.2rem,8vw,4rem);font-weight:700;letter-spacing:.08em}
.car{position:relative;background:linear-gradient(120deg,var(--bl),var(--ac));color:#fff;border-radius:16px;padding:28px 22px;min-height:190px;cursor:pointer;margin-bottom:12px}.car h2{font-family:Georgia,serif;font-size:1.7rem;margin:8px 0}
.tag{background:rgba(255,255,255,.25);border-radius:999px;padding:2px 10px;font-size:.75rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.grid h3{font-family:Georgia,serif;margin:4px 0}
small,.mu{color:var(--mu)}.bar{height:8px;border-radius:99px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.st{height:70vh;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:14px;background:#000}.st>div{height:70vh;scroll-snap-align:start;position:relative;color:#fff}.st video{width:100%;height:100%;object-fit:contain}.st .cap{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(0,0,0,.5);padding:8px;border-radius:10px}
.vb{display:block;width:100%;text-align:left;margin:4px 0;padding:8px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);cursor:pointer}
.car .mm{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:16px}.car .ov{position:absolute;inset:0;border-radius:16px;background:linear-gradient(0deg,rgba(0,0,0,.78),rgba(0,0,0,.08) 65%)}.car>*:not(.mm):not(.ov){position:relative}.car{display:flex;flex-direction:column;justify-content:flex-end;min-height:260px}
.thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:8px;background:var(--ln)}
.tl2{border-left:3px solid var(--ln);margin-left:6px;padding:2px 0 8px 14px;position:relative}.tl2:before{content:"";position:absolute;left:-9px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--d);border:3px solid var(--card)}.xt{width:100%;border-collapse:collapse;font-size:.88rem}.xt td,.xt th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}
</style>
</head>

 {id:1,d:'2026-10-12',th:'resp',pop:92,ex:1,m:VD('breath'),t:["Treino muscular respiratório: o que dizem os ensaios", "Entrenamiento muscular respiratorio: lo que dicen los ensayos", "Respiratory muscle training: what trials show"],b:["Revisões recentes indicam que o treino muscular respiratório pode reduzir a dispneia e melhorar a tolerância ao esforço quando associado ao exercício aeróbico. A carga deve ser individualizada e reavaliada a cada poucas semanas.", "Las revisiones recientes indican que el entrenamiento muscular respiratorio puede reducir la disnea y mejorar la tolerancia al esfuerzo junto con el ejercicio aeróbico. La carga debe individualizarse y reevaluarse cada pocas semanas.", "Recent reviews suggest respiratory muscle training can reduce dyspnea and improve exercise tolerance when combined with aerobic exercise. Load should be individualized and reassessed every few weeks."]},
 {id:2,d:'2026-10-08',th:'orto',pop:71,ex:1,m:IM('squat'),t:["Retorno ao esporte após lesão de LCA: critérios objetivos", "Regreso al deporte tras lesión de LCA: criterios objetivos", "Return to sport after ACL injury: objective criteria"],b:["Critérios objetivos combinam força, simetria em saltos, controle neuromuscular e preparo psicológico. O tempo isolado não é critério suficiente.", "Los criterios objetivos combinan fuerza, simetría en saltos, control neuromuscular y preparación psicológica. El tiempo por sí solo no es un criterio suficiente.", "Objective criteria combine strength, jump symmetry, neuromuscular control and psychological readiness. Time alone is not a sufficient criterion."]},
 {id:3,d:'2026-10-03',th:'geri',pop:64,ex:1,m:VD('gait'),t:["Prevenção de quedas: força, equilíbrio e marcha", "Prevención de caídas: fuerza, equilibrio y marcha", "Fall prevention: strength, balance and gait"],b:["A avaliação funcional da marcha (velocidade, simetria e variabilidade) ajuda a identificar risco de quedas. Alterações persistentes pedem intervenção multicomponente.", "La evaluación funcional de la marcha (velocidad, simetría y variabilidad) ayuda a identificar el riesgo de caídas. Los cambios persistentes requieren intervención multicomponente.", "Functional gait assessment (speed, symmetry and variability) helps identify fall risk. Persistent changes call for a multicomponent intervention."]},
